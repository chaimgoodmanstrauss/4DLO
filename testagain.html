<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        button { position: absolute; top: 20px; left: 20px; z-index: 100; }
    </style>
</head>
<body>
    <button onclick="startAudio()">Start Audio</button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let cube, analyser, dataArray;
        let smoothedRed = 0, smoothedGreen = 0, smoothedBlue = 0;
        
        // Setup Three.js
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Create cube
        cube = new THREE.Mesh(
            new THREE.BoxGeometry(2, 2, 2),
            new THREE.MeshBasicMaterial({ color: 0x00ff88 })
        );
        scene.add(cube);
        camera.position.z = 5;
        
        async function startAudio() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);
            
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            source.connect(analyser);
            
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }
        
        let framecount = 0;
        function animate() {
            requestAnimationFrame(animate);
            
            framecount++;
            if (analyser) {
                
                analyser.getByteFrequencyData(dataArray);
                
                // Red: to 131 Hz (bins ~5-23)
                let redSum = 0;
                for (let i = 0; i <= 8; i++) redSum += dataArray[i];
                let redLevel = redSum / ((8-0) * 255);
                
                // Green:  to middle C (bins ~23-46)
                let greenSum = 0;
                for (let i = 8; i <= 15; i++) greenSum += dataArray[i];
                let greenLevel = greenSum / ((15-8) * 255);
                
                // Blue: 265Hz+ (bins ~46+)
                let blueSum = 0;
                for (let i = 15; i < dataArray.length; i++) blueSum += dataArray[i];
                let blueLevel = blueSum / ((dataArray.length - 15) * 255);
                
                // Smooth each color channel
                smoothedRed += 0.9 * (redLevel - smoothedRed);
                smoothedGreen += 0.9 * (greenLevel - smoothedGreen);
                smoothedBlue += 0.9 * (blueLevel - smoothedBlue);
                
                // Update cube color
                cube.material.color.setRGB(
                    0.1 + smoothedRed * 10/3,
                    0.1 + smoothedGreen * 10/3,
                    0.1 + smoothedBlue * 10/3
                );

                if(framecount%30==0){
                    console.log(dataArray);
                    console.log(smoothedRed,smoothedGreen,smoothedBlue)}
            }
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
