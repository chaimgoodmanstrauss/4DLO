<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Graph Drawing Tool</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .canvas-container {
            position: relative;
            display: inline-block;
            border: 3px solid #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        canvas {
            display: block;
            cursor: crosshair;
            background: white;
        }
        
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        
        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 0 10px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .info {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Function Graph Drawing Tool</h1>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">
            Draw f(x): [0,1] → [0,1] by dragging your mouse
        </p>
        
        <div class="canvas-container">
            <canvas id="canvas" width="256" height="256"></canvas>
        </div>
        
        <div class="controls">
            <button onclick="resetToIdentity()">Reset to f(x) = x</button>
            <button onclick="saveFunction()">Save JSON</button>
        </div>
        
        <div class="info">
            Draw by clicking and dragging. The graph is automatically smoothed as you draw.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Function values array - index represents x*255, value represents f(x)*255
        let functionValues = new Array(256);
        
        let isDrawing = false;
        let lastX = -1;
        
        // Initialize with f(x) = x
        function resetToIdentity() {
            for (let i = 0; i < 256; i++) {
                functionValues[i] = i;
            }
            redrawGraph();
        }
        
        // Draw the current function
        function redrawGraph() {
            ctx.clearRect(0, 0, 256, 256);
            
            // Draw grid
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 1;
            
            // Vertical lines
            for (let i = 0; i <= 256; i += 32) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 256);
                ctx.stroke();
            }
            
            // Horizontal lines
            for (let i = 0; i <= 256; i += 32) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(256, i);
                ctx.stroke();
            }
            
            // Draw axes
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 2;
            
            // Y-axis (x=0)
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, 256);
            ctx.stroke();
            
            // X-axis (y=255, bottom of canvas since y is inverted)
            ctx.beginPath();
            ctx.moveTo(0, 255);
            ctx.lineTo(256, 255);
            ctx.stroke();
            
            // Draw function
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            for (let x = 0; x < 256; x++) {
                const y = 255 - functionValues[x]; // Invert y-coordinate
                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
        }
        
        // Get mouse position relative to canvas
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor((e.clientX - rect.left) * (canvas.width / rect.width)),
                y: Math.floor((e.clientY - rect.top) * (canvas.height / rect.height))
            };
        }
        
        // Smooth interpolation between points
        function smoothBetween(x1, y1, x2, y2) {
            if (x1 === x2) return;
            if (x1 > x2) {
                [x1, y1, x2, y2] = [x2, y2, x1, y1];
            }
            
            for (let x = x1; x <= x2; x++) {
                const t = (x - x1) / (x2 - x1);
                const y = Math.round(y1 * (1 - t) + y2 * t);
                functionValues[x] = Math.max(0, Math.min(255, y));
            }
        }
        
        // Mouse event handlers
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const pos = getMousePos(e);
            const x = Math.max(0, Math.min(255, pos.x));
            const y = Math.max(0, Math.min(255, 255 - pos.y)); // Invert y-coordinate
            
            functionValues[x] = y;
            lastX = x;
            redrawGraph();
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            
            const pos = getMousePos(e);
            const x = Math.max(0, Math.min(255, pos.x));
            const y = Math.max(0, Math.min(255, 255 - pos.y)); // Invert y-coordinate
            
            if (lastX !== -1 && lastX !== x) {
                smoothBetween(lastX, functionValues[lastX], x, y);
            } else {
                functionValues[x] = y;
            }
            
            lastX = x;
            redrawGraph();
        });
        
        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
            lastX = -1;
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
            lastX = -1;
        });
        
        // Save function as JSON
        function saveFunction() {
            const data = [];
            for (let i = 0; i < 256; i++) {
                data.push({
                    x: i / 255,
                    y: functionValues[i] / 255
                });
            }
            
            const jsonData = {
                description: "Function f:[0,1]->[0,1] with 256 sample points",
                samples: data
            };
            
            const blob = new Blob([JSON.stringify(jsonData, null, 2)], 
                                { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'function_data.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // Initialize
        resetToIdentity();
    </script>
</body>
</html>
